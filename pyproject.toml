[project]
name = "ledeep"
version = "1.0.0"
description = "Depth estimation using LeJEPA with SIGReg regularization"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=4.7.0",
    "hf-transfer>=0.1.9",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pillow>=12.1.1",
    "scikit-learn>=1.8.0",
    "timm>=1.0.25",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "wandb>=0.25.0",
]

[project.scripts]
setup = "src.cli:setup"
train = "src.cli:train"
evaluate = "src.cli:evaluate"
infer = "src.cli:infer"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.5",
]
server = [
    "flask>=3.1.3",
    "gunicorn>=25.1.0",
]
cuda = [
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", group = "cuda" },
]
torchvision = [
    { index = "pytorch-cu130", group = "cuda" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
